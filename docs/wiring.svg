<text x="50" y="590" font-size="16">Servo ground and controller ground must be connected. Servo power must not use the 3.3 V rail.</text>
<text x="50" y="618" font-size="16">Prototype signal diagram only: final supply, fusing, disconnect, connectors and Pi/display wiring are unresolved.</text>
