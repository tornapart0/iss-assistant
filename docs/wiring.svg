<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
<rect width="1100" height="640" fill="white"/>
<g font-family="Arial,sans-serif" fill="#17212b">
<text x="40" y="44" font-size="25">ESP32-S3 single-servo prototype wiring</text>
<text x="40" y="73" font-size="15">Repeat per controller. Servo and power-supply models remain to be selected.</text>
<g fill="#edf3f5" stroke="#17212b" stroke-width="2">
<rect x="50" y="120" width="235" height="190" rx="4"/>
<rect x="445" y="120" width="215" height="375" rx="4"/>
