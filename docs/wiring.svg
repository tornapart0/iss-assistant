<rect x="855" y="400" width="195" height="95" rx="4"/>
</g>
<text x="70" y="147" font-size="20">Joystick (3.3 V)</text>
<text x="465" y="150" font-size="20">ESP32-S3 DevKit</text>
<text x="875" y="195" font-size="20">Positional servo</text>
<text x="875" y="426" font-size="18">Servo supply</text>
<g font-size="15">
<text x="230" y="180">VCC</text><text x="465" y="180">3V3</text>
<text x="230" y="211">VRx</text><text x="465" y="211">GPIO4</text>
<text x="230" y="242">VRy</text><text x="465" y="242">GPIO5</text>
<text x="230" y="273">SW</text><text x="465" y="273">GPIO7 (pull-up)</text>
<text x="75" y="297">GND: joystick + switch return</text>
<text x="555" y="233">GPIO18</text><text x="875" y="233">Signal</text>
<text x="555" y="342">GPIO6</text><text x="465" y="469">GND</text>
<text x="875" y="271">V+</text><text x="987" y="271">GND</text>
<text x="875" y="462">V+ rated for servo</text>
<text x="875" y="485">GND</text>
<text x="67" y="376">FSR</text><text x="145" y="395">10k ohm</text>
<text x="50" y="444">3V3 → FSR → ADC node → 10k → GND</text>
</g>
<g fill="none" stroke-width="3">
<path d="M285 175 H445" stroke="#c73345"/>
<path d="M285 206 H445 M285 237 H445 M285 268 H445" stroke="#1b785a"/>
